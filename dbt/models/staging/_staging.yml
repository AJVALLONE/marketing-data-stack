version: 2

models:
  - name: stg_meta_ads__daily
    description: Cleaned Meta campaign performance. One row per campaign per day.
    columns:
      - name: campaign_day_id
        data_tests: [unique, not_null]
      - name: date_day
        data_tests: [not_null]
      - name: spend
        description: Spend in account currency.
        data_tests: [not_null]

  - name: stg_google_ads__daily
    description: Cleaned Google Ads campaign performance. Spend converted from micros.
    columns:
      - name: campaign_day_id
        data_tests: [unique, not_null]
      - name: date_day
        data_tests: [not_null]
      - name: spend
        data_tests: [not_null]

  - name: stg_shop__orders
    description: Cleaned orders with UTM source mapped to a standard channel.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [not_null]
      - name: channel
        data_tests:
          - accepted_values:
              values: ['meta', 'google', 'email', 'organic', 'other']
